<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentary</title>
    <style>
        body{
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* background-image: url(wet-sphere-reflective-water-abstract-beauty-generated-by-ai.jpg); */
        }
        .menus{
            background-color: blueviolet;
            padding: 80px;
            border-radius: 40px;
            /* border-radius: ; */
        }
        .labels{
            display: flex;
            padding: 10px;
            flex-direction: column;
        }
        input{
            padding: 10px;
            color: blue;
            border-color: brown;
        /* input.error{
            border: 2px solid#dc2626;
        } */
        
        } 
        img{
            border-radius: 99px;
            height: 80px;
            width: 80px;
        }
        button{
            background-color: green;
            color: white;
            cursor: pointer;
            border-radius: 50px;
            padding: 20px;
            border: none;
            position: absolute;
            right: 650px;
        }
        button:hover{
            background-color: blue;
            color: aqua;
        }
        input{
            
            border: none;
            border-radius: 10px;
            background-color: rgb(176, 180, 170);
            
        }
        para{
            color: red;
        }
        input.error{
            border: 2px solid red;
        }
        input.valid{
            border: 4px solid green;
        }
    </style>
</head>
<body>
    <div>
        <div class="menus">
        <form action="" id="form">
            <h1>Register Form</h1>
            <div class="labels">
                <label for="name">Name</label>
                <input type="text" name="" id="name" >
                <p id="paraname"></p>

                <label for="phone">Phone Number</label>
                <input type="number" name="" id="phone" >
                <p id="paranumber"></p>


                 <label for="email">Email</label>
                <input type="email"name="" id="email" >
                <p id="paraemail"></p>

                <label for="password">Password</label>
                <input type="password" name="" id="password" >
                <p id="parapassword"></p>

                <p id="para"></p>

            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
